name: indicators
# The indicator library (open copies of CoinKarma's indicators; scripts/fetch_ck.py, scripts/ck_indicators.py).
# Started every hour by the live chain (scripts/live_loop.py, KICK), because GitHub fires this repo's
# schedules seldom and late; the schedules below are a fallback. The first run after midnight UTC also
# takes the daily snapshots (App Store rank, Deribit option chain). A push of the scripts runs a long
# backfill. The site is rebuilt only when data/ck/indicators.json changed.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Minutes for the long backfills (the hourly runs use 8; a first backfill takes about 110)"
        default: "8"
  push:
    branches: [main]
    paths: ["scripts/fetch_ck.py", "scripts/ck_indicators.py", ".github/workflows/indicators.yml"]
  schedule:
    - cron: "21 0 * * *"
    - cron: "51 0 * * *"
    - cron: "21 2 * * *"
    - cron: "21 8 * * *"
    - cron: "21 14 * * *"
    - cron: "21 20 * * *"
permissions:
  contents: write
concurrency:
  group: ck
  cancel-in-progress: false
jobs:
  ck:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the raw series (long budget on a push, the first backfill takes about an hour)
        run: |
          budget="${{ inputs.budget }}"
          if [ "${{ github.event_name }}" = push ]; then budget=110; fi
          python scripts/fetch_ck.py --budget "${budget:-8}"
        continue-on-error: true
        timeout-minutes: 130
      - name: Compute the indicators
        id: ind
        run: |
          python -m pip install --quiet numpy
          before=$(git hash-object data/ck/indicators.json 2>/dev/null || echo none)
          if [ -f scripts/ck_indicators.py ]; then python scripts/ck_indicators.py; fi
          after=$(git hash-object data/ck/indicators.json 2>/dev/null || echo none)
          if [ "$before" != "$after" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi
        continue-on-error: true
        timeout-minutes: 15
      - name: Commit if changed
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ck || true
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -q -m "indicators: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 7
            done
            if [ "$ok" = 1 ]; then echo "data pushed"; else echo "::warning::could not push the indicators commit"; fi
          fi
      - name: Build the website
        if: steps.ind.outputs.changed == '1'
        run: |
          git pull -q --rebase origin main || true
          python scripts/build_site.py --out "$RUNNER_TEMP/site"
      - name: Publish it to the "site" branch
        if: steps.ind.outputs.changed == '1'
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b site
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site && break; sleep 5; done
        env:
          GH_TOKEN: ${{ github.token }}
