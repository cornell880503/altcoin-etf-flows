name: live-watchdog
# Restarts the hourly chain (liq-live) when no run of it is running or queued. Short and stateless, so
# it does not matter that GitHub fires only some of these schedules.
on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
permissions:
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Is the hourly chain alive?
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/liq-live.yml/runs"
          busy=0
          for s in in_progress queued waiting pending requested; do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api?status=$s&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count', 0))")
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then echo "chain alive ($busy)"; exit 0; fi
          echo "no live run: restarting the chain"
          curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/liq-live.yml/dispatches" \
            -d '{"ref":"main"}'
        env:
          GH_TOKEN: ${{ github.token }}
