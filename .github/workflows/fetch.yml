name: fetch-etf-flows
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: fetch-etf-flows
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch flows (full per-fund history pages)
        run: python scripts/fetch_flows.py
      - name: Fetch flows (MCP endpoint, smaller assets)
        run: python scripts/fetch_mcp.py
        continue-on-error: true
      - name: Fetch Canary primary data (shares outstanding x NAV)
        run: python scripts/fetch_canary.py
        continue-on-error: true
      - name: Fetch ETF closes (Yahoo, Stooq fallback)
        run: python scripts/fetch_prices.py
        continue-on-error: true
        timeout-minutes: 4
      - name: Build the cleaned daily series (data/daily.json)
        run: python scripts/build_daily.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
