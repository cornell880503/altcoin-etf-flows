name: fetch-etf-flows
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 14 * * *"  # extra run mid-morning New York, when the previous day's flows are usually complete
    - cron: "52 7 * * *"   # extra run after Binance publishes yesterday's open-interest files (~06:45 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: fetch-etf-flows
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # the newest main when the job starts: a run queued behind another must see its data commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch flows (official API with key; per fund every run, asset totals once a day)
        run: python scripts/fetch_api.py
        env:
          CRYPTOETF_API_KEY: ${{ secrets.CRYPTOETF_API_KEY }}
        continue-on-error: true
        timeout-minutes: 4
      - name: Fetch flows (site pages; only for a coin the API did not deliver)
        run: python scripts/fetch_flows.py
        continue-on-error: true
      - name: Fetch flows (Farside, backup for a coin cryptoetf.today did not deliver)
        run: python scripts/fetch_farside.py
        continue-on-error: true
      - name: Fetch flows (MCP endpoint, smaller assets)
        run: python scripts/fetch_mcp.py
        continue-on-error: true
      - name: Fetch market caps (CoinGecko, once a day)
        run: python scripts/fetch_mcap.py
        continue-on-error: true
        timeout-minutes: 6
      - name: Fetch each coin's own price (daily close 00:00 UTC, plus 10:00 / 16:00 New York)
        run: python scripts/fetch_coin_px.py
        continue-on-error: true
        timeout-minutes: 20
      - name: Fetch Canary primary data (shares outstanding x NAV)
        run: python scripts/fetch_canary.py
        continue-on-error: true
      - name: Build the cleaned daily series (data/daily.json)
        run: python scripts/build_daily.py
        continue-on-error: true
      - name: Altcoin leverage radar (new Binance open-interest day, Coin Metrics market caps, data/oi/radar.json)
        run: |
          python -m pip install --quiet numpy
          python scripts/radar_update.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Check that every coin's flows are current (alarm at most once a day while data are missing)
        id: fresh
        run: python scripts/check_fresh.py
        continue-on-error: true  # the page is still built and published; the last step turns the run red
      - name: Commit if changed
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4; do
              # data fetched just now wins any conflict; a failed rebase is undone so the files stay valid
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 7
            done
            if [ "$ok" = 1 ]; then echo "data pushed"; else echo "::warning::could not push the data commit"; fi
          fi
      - name: Install numpy (the signal research on the website needs it)
        run: python -m pip install --quiet numpy
        continue-on-error: true
      - name: Build the website (one static page with all the data)
        run: python scripts/build_site.py --out "$RUNNER_TEMP/site"
      - name: Publish it to the "site" branch (servers pull it from there)
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b site
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site && break; sleep 5; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Turn the run red if a published trading day is missing (see the check step)
        if: steps.fresh.outcome == 'failure'
        run: |
          echo "::error::Flows are missing for a published trading day; data/freshness.json lists them"
          exit 1
