name: fetch-etf-flows
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 14 * * *"  # extra run mid-morning New York, when the previous day's flows are usually complete
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: fetch-etf-flows
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch flows (full per-fund history pages)
        run: python scripts/fetch_flows.py
      - name: Fetch flows (MCP endpoint, smaller assets)
        run: python scripts/fetch_mcp.py
        continue-on-error: true
      - name: Fetch flows (REST API with key, once a day)
        run: python scripts/fetch_api.py
        env:
          CRYPTOETF_API_KEY: ${{ secrets.CRYPTOETF_API_KEY }}
        continue-on-error: true
        timeout-minutes: 4
      - name: Fetch market caps (CoinGecko, once a day)
        run: python scripts/fetch_mcap.py
        continue-on-error: true
        timeout-minutes: 6
      - name: Fetch each coin's own price (10:00 / 16:00 New York)
        run: python scripts/fetch_coin_px.py
        continue-on-error: true
        timeout-minutes: 20
      - name: Fetch Canary primary data (shares outstanding x NAV)
        run: python scripts/fetch_canary.py
        continue-on-error: true
      - name: Build the cleaned daily series (data/daily.json)
        run: python scripts/build_daily.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
          fi
      - name: Build the website (one static page with all the data)
        run: python scripts/build_site.py --out "$RUNNER_TEMP/site"
      - name: Publish it to the "site" branch (servers pull it from there)
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b site
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site && break; sleep 5; done
        env:
          GH_TOKEN: ${{ github.token }}
