name: oi-data
# Full open-interest and market-cap fetch for the altcoin leverage radar (data/oi/): backfill and
# gap filling (every contract's file list is checked). The daily update runs in fetch-etf-flows
# (scripts/radar_update.py, --daily mode); this one shares its concurrency group so the two never
# write data/oi at the same time.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_oi_binance.py", "scripts/fetch_cm_mcap.py", ".github/workflows/oi-data.yml"]
permissions:
  contents: write
concurrency:
  group: fetch-etf-flows
  cancel-in-progress: false
jobs:
  oi:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Coin Metrics market caps
        run: python scripts/fetch_cm_mcap.py
        continue-on-error: true
        timeout-minutes: 30
      - name: Binance open interest
        run: python scripts/fetch_oi_binance.py --budget 270
        continue-on-error: true
        timeout-minutes: 295
      - name: Commit
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/oi || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -m "oi data: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 9; done
          fi
