name: book-data
# Data for the LIQ copies: hourly candles (scripts/fetch_px_binance.py; data/ck/px1h) and hourly
# order-book depth (scripts/fetch_book_binance.py; data/ck/book) of Binance USD-M perpetuals.
# The first run backfills from 2023-01-01 (about 34,000 daily depth files); a run that reaches its time
# budget stops and the next one goes on. Binance publishes a day's files some time the next day (the
# order book about 21-23 hours after the day ends), so the live chain (scripts/live_loop.py, KICK) starts
# this every hour, and the schedule below is a fallback (a run with nothing new only gets 404s); the
# hourly live LIQ (liq-live) is calibrated on the hours both have, so the sooner they arrive the better.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_book_binance.py", "scripts/fetch_px_binance.py"]
  schedule:
    - cron: "37 */2 * * *"
permissions:
  contents: write
concurrency:
  group: book
  cancel-in-progress: false
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hourly candles
        run: python scripts/fetch_px_binance.py --budget 20
        continue-on-error: true
        timeout-minutes: 25
      - name: Commit the candles
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ck/px1h || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "candles: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 9
            done
            if [ "$ok" = 1 ]; then echo "pushed"; else echo "::warning::could not push the candles commit"; fi
          fi
      - name: Order-book depth
        run: |
          budget=25
          if [ "${{ github.event_name }}" != schedule ]; then budget=140; fi
          python scripts/fetch_book_binance.py --budget "$budget"
        continue-on-error: true
        timeout-minutes: 160
      - name: Commit the order book
        run: |
          git add -A data/ck/book || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "order book: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 9
            done
            if [ "$ok" = 1 ]; then echo "pushed"; else echo "::warning::could not push the order-book commit"; fi
          fi
