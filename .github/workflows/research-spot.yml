name: research-spot
# One-off research run: spot order books for BTC (research/spot_btc_liq.py), to compare with
# CoinKarma's charted LIQ. Writes research/spot/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/spot_btc_liq.py"]
permissions:
  contents: write
concurrency:
  group: research-spot
  cancel-in-progress: false
jobs:
  spot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Spot books
        run: python research/spot_btc_liq.py
        continue-on-error: true
        timeout-minutes: 110
      - name: Commit
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/spot || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "research spot: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 9; done
          fi
