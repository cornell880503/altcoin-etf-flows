name: binspot
# Binance spot order books for the LIQ family (scripts/binance_spot_ws.py), kept by one long job at a time:
# each runs about 5.7 hours, then starts the next and hands it its books without a gap (the new job listens
# to the stream first; the old one then saves its books on the binspot-state branch and stops). A push of the
# script starts a job that takes over the same way. liq-live's hourly loop starts a job whenever none runs.
# No concurrency group: the old and the new job overlap for a few minutes on purpose.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "start the next job after this many minutes (a short value tests the hand-over)"
        required: false
        default: "340"
  push:
    branches: [main]
    paths: ["scripts/binance_spot_ws.py", ".github/workflows/binspot.yml"]
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy websocket-client
      - name: Collect
        run: python scripts/binance_spot_ws.py --run --minutes "${MINUTES:-340}"
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
