name: probe-books-more
# One-off probe: which other order books (live and historical) a runner can get (research/probe_books_more.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/probe_books_more.py"]
permissions:
  contents: write
concurrency:
  group: probe-books-more
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet websocket-client
      - name: Probe
        run: python research/probe_books_more.py
        continue-on-error: true
        timeout-minutes: 10
      - name: Commit
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/probe_books_more || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "probe books: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 9; done
          fi
