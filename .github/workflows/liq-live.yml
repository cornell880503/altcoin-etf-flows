name: liq-live
# The hourly LIQ: snapshots of live order books (scripts/fetch_book_live.py: OKX swaps, Coinbase spot,
# Hyperliquid) twice an hour, three each, averaged per UTC hour into data/ck/live/hours/. Binance's own
# order-book files come the next day (book-data); until then the site's LIQ and resonance cards use these
# books mapped onto Binance's scale (scripts/ck_liq.py). The site is rebuilt once per completed hour.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_book_live.py"]
  schedule:
    - cron: "10 * * * *"
    - cron: "40 * * * *"
permissions:
  contents: write
concurrency:
  group: liq-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Order-book snapshots
        run: python scripts/fetch_book_live.py --rounds 3 --gap 100
        continue-on-error: true
        timeout-minutes: 10
      - name: Commit the snapshots
        run: |
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ck/live || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "live book: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 7
            done
            if [ "$ok" = 1 ]; then echo "pushed"; else echo "::warning::could not push the live-book commit"; fi
          fi
      - name: Is there a newly completed hour?
        id: due
        run: |
          H=$(date -u -d '1 hour ago' +%Y-%m-%dT%H)
          P=$(python -c "import json; print(json.load(open('data/ck/live/_meta.json')).get('published_hour', ''))" 2>/dev/null || true)
          if [ "$H" != "$P" ]; then echo "hour=$H" >> "$GITHUB_OUTPUT"; echo "publish for $H"; else echo "$H already published"; fi
      - name: Build the website
        if: steps.due.outputs.hour != ''
        run: |
          python -m pip install --quiet numpy
          git pull -q --rebase origin main || true
          python scripts/build_site.py --out "$RUNNER_TEMP/site"
      - name: Publish it to the "site" branch
        if: steps.due.outputs.hour != ''
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b site
          git config user.name "etf-flows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site && break; sleep 5; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record the published hour
        if: steps.due.outputs.hour != ''
        run: |
          python - <<'PY'
          import json
          p = "data/ck/live/_meta.json"
          try:
              m = json.load(open(p))
          except Exception:
              m = {}
          m["published_hour"] = "${{ steps.due.outputs.hour }}"
          json.dump(m, open(p, "w"), indent=1, sort_keys=True)
          PY
          git add data/ck/live/_meta.json
          if ! git diff --cached --quiet; then
            git commit -q -m "live book: published ${{ steps.due.outputs.hour }}"
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 7
            done
          fi
