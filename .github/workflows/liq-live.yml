name: liq-live
# The hourly layer of the site (scripts/live_loop.py): one job of about three hours that snapshots live
# order books every 10 minutes, fetches the other live values and rebuilds the site once per completed
# hour, then dispatches its successor. GitHub's cron fires too seldom and too late for hourly work (on
# this repo about one scheduled run in five, often hours late), while a workflow_dispatch from the
# job itself starts within a minute. live-watchdog.yml restarts the chain if it ever breaks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/live_loop.py", "scripts/fetch_book_live.py", "scripts/fetch_live_extras.py", ".github/workflows/liq-live.yml"]
permissions:
  contents: write
  actions: write
concurrency:
  group: liq-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Live loop (about three hours)
        run: python scripts/live_loop.py --minutes 170 --every 10
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        timeout-minutes: 185
      - name: Hand over to the next run
        if: always()
        run: |
          m=$(cat "$RUNNER_TEMP/live_minutes" 2>/dev/null || echo 0)
          r=$(cat "$RUNNER_TEMP/live_reason" 2>/dev/null || echo error)
          if [ "$r" = update ] || [ "${m%.*}" -ge 20 ]; then
            curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/liq-live.yml/dispatches" -d '{"ref":"main"}'
          else
            echo "the loop ended after $m minutes ($r): no hand-over (live-watchdog will retry)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
